# Base44 dev environment for Fixtop.
#
# The app is a Vite static SPA that talks to Supabase directly from the browser.
# It runs here from the cloned source with Vite's dev server (bind mount), so
# edits appear in the preview without rebuilding an image. There is no backend
# service: the only external dependency is the Supabase project, whose URL and
# anon key are delivered as app secrets via /run/base44/app.env.
services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000 --strictPort
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - fixtop_node_modules:/app/node_modules
    env_file:
      # Placeholders first so the app boots without credentials …
      - ./.env.base44-defaults
      # … real secrets last, they always win.
      - /run/base44/app.env
    environment:
      # Sandbox flag (unset in normal development); passed through untouched.
      - BASE44_PREVIEW_MODE
      # Vite >= 6.1 reads this to allow the preview proxy's hostname.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    healthcheck:
      # Probes that the dev server actually serves the app shell.
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: on-failure
    labels:
      base44.project: Fixtop Katalog
      base44.kind: web
      base44.port: "3000"

volumes:
  fixtop_node_modules:
